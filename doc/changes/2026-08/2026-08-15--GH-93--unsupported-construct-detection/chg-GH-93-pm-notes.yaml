  - text: >
      CLARIFY_SCOPE ANALYSIS (code cross-check vs feature-reverse-conversion.md
      + src/infra/confluence/parse/reverse.ts + reverse-parser.ts):
      DELIVERED by GH-92: coarse blocking code reverse/unsupported-construct
      + construct identity + {line,column}; unknown macros/elements detected;
      9 storage-side fixtures (tests/adversarial-storage/); REVERSE_CODES
      additions-only registry. GH-93 DELTAS: (1) SILENT-DROP GAPS violate
      AC-2/C-4 — attributes on canonical elements (colspan/rowspan/style/
      class/data-table-width = ticket "exotic table attributes") pass through
      classifyElement and are dropped at serialization with NO diagnostic;
      non-ac:task children of ac:task-list dropped silently in
      classifyTaskListElement filter. (2) "complex layouts" (ac:layout/
      ac:layout-section/ac:layout-cell) fall to generic unknown-element arm —
      detected but no dedicated construct classification or fixture. (3) AC-3
      "page + element location" — diagnostics carry element {line,column} only;
      ReverseOptions.sourcePath is reserved-but-UNUSED (reverse.ts:24-27); no
      page identity in payload. (4) GH-31 corpus reuse — tests/adversarial/
      is Markdown-side (forward classifier findAllUnsupported, GH-31);
      tests/adversarial-storage/ covers 7/12 forward categories; spec must
      define the alignment (mirror fixtures vs dual-direction runner).
      CONSTRAINTS: K1 carve-out (ac:schema-version/ac:macro-id silently
      dropped per ADR-0005) must survive; corpus-A round-trip must emit 0 new
      diagnostics on canonical fixtures; library-only boundary (0 CLI delta,
      ReverseError not a MarkSyncError kind) per GH-92 precedent.
      VERDICT: requirements complete + consistent with system spec; no
      human-blocking questions. Design decisions delegated: code granularity
      (coarse vs per-class codes), page-location semantics (sourcePath vs
      pageId), corpus mapping — spec-writer (+ decision-advisor if
      precedent-setting).
    type: info
    date: "2026-08-15"
  - text: >
