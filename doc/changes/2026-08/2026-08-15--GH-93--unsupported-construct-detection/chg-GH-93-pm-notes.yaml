decisions:
  - text: >
      DEC (spec): granular per-class diagnostic codes confirmed via TDR-0014
      (@decision-advisor, Proposed — human confirms at PR review, flips
      Accepted at merge per TDR-0012/0013 precedent). 4 new codes
      (reverse/unknown-macro, reverse/complex-layout,
      reverse/unsupported-attribute, reverse/unknown-element) + retained
      structural fallback reverse/unsupported-construct; 2 emitted-code
      re-assignments (consumerless window verified by grep). PINS for
      test-plan + plan: (1) orphaned layout-family elements classify as ONE
      reverse/complex-layout at outermost family element present — needs
      fixture; (2) E2/E3 consumers route on code string only; construct is
      display-only. PM-confirmed OQ-3: minor version bump 0.9.0→0.10.0.
      OQ-2 (element-level attr location) + OQ-4 (uniform page echo) stand as
      spec-resolved.
