notes:
  - text: >
      INTAKE CONTEXT. Issue #90 ([MS3-E0-S1], priority:critical, MS-0003,
      spike label, OPEN, no blockers). Scope authority = PDR-0002 + issue body
      (no MS-3 story file yet — ticket says added later under
      doc/planning/milestones/MS-3/). Blocks MS3-E2-S1 (resolve design lock)
      + MS3-E5-S2 (read-permission check design); deliverable parallel with
      MS3-E0-S2 (in-process Mermaid spike — NOT this ticket).
    type: info
    date: "2026-08-15"
  - text: >
      PRIOR-EVIDENCE INSIGHT (scope reducer). The MS-0001 inception spike
      (2026-07-03, live vs cwiakalski.atlassian.net space marksyncte/39223300)
      ALREADY proved v2 historical fetch:
      GET /wiki/api/v2/pages/{id}?version={n}&body-format=storage returns the
      version-n body under current metadata (evidence P5-06), and
      GET /wiki/api/v2/pages/{id}/versions?body-format=storage returns bodies
      inline newest-first (evidence P5-05); v2 versions/{n} returns metadata
      incl. authorId/message/createdAt. See
      doc/inception/integration-scenarios/08-page-versions.md. GH-90's DELTA:
      (1) v1 form GET /wiki/rest/api/content/{id}?status=historical&version={n}&expand=body.storage,
      (2) deleted/trashed-page version-fetch behavior, (3) documented version
      metadata availability, (4) fresh live re-validation, (5) TDR-0011
      verdict + limitations + fallback consequence (snapshot base body in
      lock/cache per PDR-0002 revisit trigger).
    type: info
    date: "2026-08-15"
  - text: >
      AC MAPPING. AC-1 (>=3 version states evidence) = historical N + current
      + deleted/edge on BOTH v1 and v2 forms. AC-2 (metadata: author,
      timestamp, message) = v2 versions endpoints + v1 expansions. AC-3
      (limitations + verdict w/ consequences for base-version capture) = TDR
      body. AC-4 (TDR created with evidence links) = TDR-0011 in
      doc/decisions/ + 00-index row. All redaction per C-7/NFR: no token,
      email, or Basic-auth header in any captured artifact.
    type: info
    date: "2026-08-15"
