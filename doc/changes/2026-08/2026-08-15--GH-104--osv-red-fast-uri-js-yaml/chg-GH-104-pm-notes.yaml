decisions:
  - text: >
      js-yaml mechanism = package.json overrides entry "js-yaml": "^4.3.1"
      (NOT a direct dependency). Ticket says "bump direct dependency" but
      js-yaml is not direct: `yaml` (^2.9.0) is the direct YAML lib; js-yaml
      is transitive via @commitlint/load → cosmiconfig → js-yaml ^4.1.0
      (dev chain, never imported in src/). Adding an unused direct dep would
      be worse than the established fast-uri override pattern. The ticket AC
      is mechanism-neutral ("bun.lock pins js-yaml >= 4.3.1"), so the
      override satisfies it. PM-decided to unblock; recorded here and seeded
      to spec.
    date: 2026-08-15

