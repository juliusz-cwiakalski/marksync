findings:
  - id: F-1
    severity: critical
    confidence: high
    category: correctness
    location: src/infra/confluence/parse/reverse.ts:97
    message: >-
      Collect-all maps informational diagnostics into the blocking error shape (kind "UnsupportedConstruct"),
      discarding severity/class, so DM-2's two-class taxonomy collapses and the normative test-plan §4.4
      parity (all.diagnostics[0] deep-equals the fast-fail error) breaks whenever an informational precedes
      a blocking construct in document order. Empirically reproduced: mermaid render artifact + gliffy macro
      yields all[0] = informational mislabeled as UnsupportedConstruct vs fast-fail = gliffy blocking.
    suggestion: >-
      Return ReverseDiagnostic[] preserving severity/class (filter to blocking for the error arm, surface
      informationals separately) and add a mixed-order parity test asserting the first blocking entry
      deep-equals the fast-fail error.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    confidence: high
    category: correctness
    location: src/infra/confluence/parse/reverse.ts:62
    message: >-
      Runtime blocking error {kind, code, construct, location} does not match the declared
      BlockingDiagnostic {severity, class, code, construct, location} (reverse-diagnostics.ts:15-21);
      the divergence is silenced by "as unknown as ReverseError" double casts. Consumers cannot
      discriminate ReverseError arms reliably and never-exhaustive checks are unsound.
    suggestion: >-
      Declare the error union faithfully (e.g. a {kind: "UnsupportedConstruct"} variant in the domain
      model) and construct it type-safely without double casts.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: high
    confidence: high
    category: correctness
    location: src/infra/confluence/parse/reverse-parser.ts:110
    message: >-
      Whitespace-only text containing a newline is dropped in every context (parse-time flushText and
      normalizeChildren), including between inline siblings. Repro: <p>foo <strong>a</strong>\n<em>b</em>
      baz</p> reverses to "foo **a***b* baz" — the HTML-rendered space is silently lost and words join.
      Exceeds K1 tolerance; silent content loss on the RSK-2 real-read-back path.
    suggestion: >-
      Drop structural whitespace only between block-level siblings; in phrasing-content contexts collapse
      the chunk to a single space. Add a reflowed-paragraph fixture.
    suppressed: false
    published_url: null
    published_at: null
