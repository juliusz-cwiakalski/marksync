summary: >-
  First review of the GH-92 reverse converter (Storage Format -> Markdown). Delivery is substantially
  strong: 468 reverse-surface tests pass, corpus-A byte equality 26/26, forward golden fixtures
  byte-unchanged (additions only), src/cli untouched (PD-2 honored), saxes exact 6.0.0, options layer
  single-point in hast-to-markdown.ts, no mock.module. FAIL is driven by an empirically reproduced
  collect-all contract violation (informational diagnostics relabeled as blocking errors; all[0] does
  not deep-equal the fast-fail error when an informational precedes a blocking construct), a
  runtime/type divergence on the blocking-error arm masked by double casts, silent inline content loss
  where inter-sibling structural whitespace is dropped, and normative TC-RT-002 left as a placeholder
  while the plan records tasks 5.3/5.4 complete. This iteration merges two colliding prior review
  passes (each had verified-real findings the other missed) into one authoritative set; the plan now
  carries a single Phase 7 remediation.
