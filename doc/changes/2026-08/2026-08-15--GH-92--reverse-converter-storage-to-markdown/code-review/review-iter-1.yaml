summary: >-
  First review of the GH-92 reverse converter. Delivery is substantially strong: 362 new/affected tests
  pass, forward golden fixtures are byte-unchanged (additions only), src/cli is untouched (PD-2 honored),
  saxes pinned exact 6.0.0, and the options layer lives solely in hast-to-markdown.ts. FAIL is driven by
  an empirically-proven collect-all contract violation (informational diagnostics relabeled as blocking
  errors; all.diagnostics[0] does not deep-equal the fast-fail error when an informational precedes a
  blocking construct), a runtime/type divergence on the blocking-error arm masked by double casts, and a
  silent content-loss edge where inter-inline structural whitespace is dropped (rendered space lost).
