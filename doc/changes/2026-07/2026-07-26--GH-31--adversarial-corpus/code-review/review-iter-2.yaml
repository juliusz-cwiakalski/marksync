  - id: F-3
    severity: info
    confidence: high
    category: performance
    location: src/domain/markdown/unsupported.ts:119
    message: >
      findUnsupported now delegates to collectAll and returns all[0], so it
      performs a full-tree walk even when the first node is unsupported — the old
      walk short-circuited at the first hit. The first-hit CORRECTNESS guarantee
      is preserved (all[0] == old first hit, verified incl. unsupported-parent
      case); only first-hit EFFICIENCY is lost. This is the intended tradeoff of
      by-construction parity via a single walker; trees are small and the
      function is called once per render, not in a hot loop.
    suggestion: >
      No action required. If full-walk cost ever matters, a shared generator/
      visitor with findFirst/findAll consumers could restore short-circuiting
      while keeping a single source of truth.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-4
    severity: info
    confidence: medium
    category: documentation
    location: doc/quality/adversarial-corpus-classification.md:12
    message: >
      The UnsupportedConstruct row example was changed from <aside> to
      "<table> at block scope". This is accurate for raw-HTML <table> blocks
