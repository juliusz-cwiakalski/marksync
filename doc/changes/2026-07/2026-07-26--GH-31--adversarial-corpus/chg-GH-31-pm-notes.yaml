notes:
  - text: >
      Intake 2026-07-26. Fresh delivery on clean main (a83e05d). Deps
      MS2-E3-S3 (GH-20) + MS2-E3-S5 (GH-22) both CLOSED — no blocked label
      needed. No story-blocking questions; CEO pre-resolved R1 (sanitization:
      automated grep + human review) + Q1 (corpus size ~20-40).
  - text: >
      Scope clarification (PM, non-blocking): this is a TEST+DOCS story with
      one minor src/ addition. (1) MS-0002 pipeline is ONE-WAY
      Markdown→Storage, so Confluence macros/app-content/gliffy are NOT
      authorable in GFM → represented as raw-HTML blocks (→ raw-html-block
      UnsupportedConstruct) or hand-built HAST nodes (precedent:
      unsupported.test.ts builds math/dl/section by hand). (2) AC "every
      unsupported node classified" requires a collect-all variant because
      findUnsupported() returns only the FIRST hit — coder adds
      findAllUnsupported() (or runner-level walk) returning all hits; no
      behavior change to existing findUnsupported. (3) "Drift stability" AC =
      classification DETERMINISM (classify corpus twice → identical
      classification.json), NOT the sync-state classify() in
      src/domain/state/classifier.ts. (4) Corpus is SYNTHETIC adversarial
      fixtures (no real design-partner pages exist pre-launch); sanitized by
      construction + grep self-audit.
    type: decision
    date: "2026-07-26"
  - text: >
      Known doc impacts (for @doc-syncer phase 7): (a) NEW
      doc/quality/adversarial-corpus-classification.md (deliverable — user-facing
      classification table); (b) doc/spec/features/feature-safe-publish.md
      markdown-pipeline row — note adversarial corpus as regression suite +
      the new findAllUnsupported export; (c) .ai/rules/testing-strategy.md —
      register the adversarial tier/category under golden+integration; (d)
      possibly doc/spec/nonfunctional.md NFR-REL-4 (fidelity) — link corpus
      as evidence. doc/quality/ currently only has test-specs/.
    type: risk
    date: "2026-07-26"
  - text: >
      Retro — DoR iter-1 NOT_READY (2026-07-26): @readiness-reviewer caught 2
      BLOCKERs + 5 MAJORs + 6 MINOR/NIT. BLOCKERs: (1) CI runs only
      tests/unit|integration|golden — tests/adversarial/ would be CI-invisible,
      defeating the regression-suite purpose; (2) spec §13 dependency row
      wrongly claims corpus "stress-tests E3-S5/GH-22 sync drift classifier",
      contradicting DEC-3/NG-3. MAJORs: "long page" proxy (2× largest golden
      = only 1.7KB) too small; TC-001 tier "Unit" does FS I/O + tests/adversarial/
      unsanctioned tier; TC-004 omits unsupported-fixture branch
      (renderStorage returns ok=false); {expand} macro silently dropped from
      deliverable list; plan omits testing-strategy.md tier registration.
      PM DECISION D5 resolves BLOCKER-1 + MAJOR-4 + MAJOR-7 at once by
      relocating RUNNERS to tests/golden/adversarial/ (golden-tier, CI-covered,
      sanctioned) while keeping fixtures at tests/adversarial/ per story. Gap
      not caught earlier: the three author agents (spec/test-plan/plan)
      independently chose tests/adversarial/ for runners without checking CI
      wiring or tier sanctioning — a cross-artifact consistency gap the DoR
      gate exists to catch. Process improvement: author agents should verify
      new test directories against ci.yml + testing-strategy.md tiers before
      committing paths.       Reopening specification/test_planning/delivery_planning
      for iter-2 fixes.
    type: retro
    date: "2026-07-26"
  - text: >
      Delivery complete 2026-07-26. @coder executed all 6 plan phases (commits
      ceb0073..0dfe61c). bun run check GREEN: 1308 pass/0 fail (up from 1248
      on main), typecheck clean, boundaries clean. 33-fixture golden suite
      still byte-exact (39 tests). DEC-5 verified: bun test tests/golden/
      discovers all 3 adversarial runners (classification-runner 36 tests,
      corpus-inventory 7, pii-audit 4). 12 synthetic fixtures + 12 mandatory
      classification sidecars covering all 6 AC-F1-1 categories (long-page =
      1509 lines). Minor coder adjustments (all in-spec): (1) removed a fake
      email + MS-0002 ref from initial fixtures to pass the PII self-audit
      (TC-008) — self-validating guardrail worked as designed; (2) emoji
      detection switched from regex range to explicit emoji set to avoid
      range issues; (3) source-path normalized to bare filename in sidecars.
      src/domain/markdown/unsupported.ts is the only src/ touch (additive
      findAllUnsupported, +67 lines, refactored walker to share predicate).
      All 8 AC PASS per coder self-report; @reviewer will verify.
    type: info
    date: "2026-07-26"
  - text: >
      Retro — review iter-1 FAIL (2026-07-26): @reviewer caught 2 MAJORs.
      MAJOR-1 is the significant one: DEC-2/spec assumed Confluence macros
      authored as <ac:structured-macro> in Markdown would be raw-HTML BLOCKS
      (→ raw-html-block fast-fail). In REALITY remark parses namespaced tags
      as INLINE raw HTML → silently escaped at render (ok:true, no flag,
      findAllUnsupported returns []). The classification doc claimed
      fast-fail — factually wrong. The corpus therefore SURFACED a genuine
      ADR-0005 silent-degradation vector (macros → escaped literal text,
      no warning) — which is exactly what an adversarial corpus is FOR.
      Honest fix: correct the doc to state macros silently escape (known
      limitation, MS-0003+), reframe fixtures; do NOT pretend a fast-fail
      that doesn't happen. MAJOR-2: plan mandated shared-traversal refactor
      (parity by construction); coder delivered duplicated walker (walk +
      walkCollect) — parity by-test not by-construction. Both MAJORs are
      legit; routing remediation to @coder. Gap not caught earlier: the
      spec/plan's DEC-2 macro representation assumption was never validated
      against the real remark parser before delivery — a "trust the
      assumption" gap. Process improvement: for any spec claim about parser
      behavior, the spec-writer/plan-writer should verify with a 5-line
      repro before committing it as a DEC. Also MINORs: corpus count 12
      (below ~20-40 target, but AC is category coverage not count); weak
      macro-category assertion; dead golden-match branch; CWD-relative paths
      in 2 tests; TC-002 missing raw-block parity case.
    type: retro
    date: "2026-07-26"
