decisions:
  - id: DEC-5
    text: >
      Test RUNNERS (classification-runner, corpus-inventory, pii-audit) live
      at tests/golden/adversarial/*.test.ts (golden-tier — real pipeline,
      committed sidecars/goldens, no mocks); FIXTURES (data) stay at
      tests/adversarial/ per the story's explicit path. Rationale: CI glob
      tests/golden/ already discovers tests/golden/adversarial/, so no ci.yml
      change needed (resolves DoR BLOCKER finding 1); runners are sanctioned
      by the existing golden tier, not a new unsanctioned tier (resolves MAJOR
      finding 4); no testing-strategy.md tier registration required (resolves
      MAJOR finding 7); mirrors the existing tests/golden/markdown/ runner +
      tests/golden/fixtures/markdown/ data split.
    date: "2026-07-26"
