  - text: >
      clarify_scope COMPLETE. doctor.ts is a STUB (src/cli/commands/doctor.ts
      returns err INTERNAL "doctor is not yet implemented (MS2-E5-S2)") — same
      pattern as GH-28 repair-state was. All primitives delivered:
