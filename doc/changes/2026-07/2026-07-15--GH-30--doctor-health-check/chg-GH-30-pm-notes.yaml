decisions:
  - text: >
      Exit-code resolution (DEC-4 / OQ-1). Mechanism: doctor constructs
      CommandResult<DoctorReport> directly (not ok()/err()); data always
      present, error never set; exitCode from report worst status. Numeric:
      TDR-0009 confirms Option A — new dedicated EXIT_HEALTH=60 + code string
      DOCTOR_FAIL (lives only in CODE_TO_EXIT, not in error-kind→code mapper;
      additive, no reclassification; CONFLICT→30 AC-6 untouched).
