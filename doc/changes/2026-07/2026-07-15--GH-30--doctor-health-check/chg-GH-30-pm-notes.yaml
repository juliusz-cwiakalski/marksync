notes:
  - text: >
      Retro — SERIOUS: coder Phase 2 (src/app/doctor.ts) has 29 typecheck
      errors that bun test did NOT catch (Bun strips types without full
      checking; coder reported "bun run check green" but typecheck was
      broken). Errors reveal REAL bugs, not type noise: (1) target.deletePage
      hallucinated — does NOT exist on TargetSystem port (self-cleaning
      scratch-page probe AC-F3-2 cannot work against the real adapter);
      (2) .value/.error accessed on Result without .ok narrowing (unsafe,
      pervasive); (3) ConfluenceCredentials built incomplete (missing
      email/mode) — credsResult.value IS already complete, should pass
      directly; (4) Page.pageId used (should be Page.id); (5) humanMessage
      accessed on MarkSyncError union without narrowing to InvalidConfig;
      (6) AccountIdentity.email (doesn't exist — has accountId/displayName);
      (7) string|null null-handling. Unit tests passed only because the
      injected mock TargetSystem had deletePage (more methods than the real
      port) — mock-conformance gap. Root cause: coder relied on bun test
      (transpile-only) instead of bun run typecheck (tsc) for the type
      gate; the "green" claim concealed a broken typecheck. PROCESS FIX:
      quality gates must run bun run typecheck explicitly, not just bun test.
      Delegate comprehensive fix to @fixer.
    type: retro
    date: "2026-07-15"
