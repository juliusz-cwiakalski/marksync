      read + probe methods doctor needs. This story = orchestration + UX +
      diagnostics, not new domain logic. Pattern: thin CLI handler
      (repair-state.ts) + app-tier orchestration (repair.ts). CEO-resolved
      R1/Q1 in story file: default doctor is READ-ONLY (auth GET + space GET
      + parent GET); scratch-page capability probes only with
      --probe-capabilities. No blocking questions. Dependencies E2-S2/S3/S4
      + E3-S4 ALL merged.
    type: info
    date: "2026-07-15"
  - text: >
      Design point for spec (not a blocker — spec-writer resolves): AC#5
      "exit code non-zero on any fail" interacts with the ok() factory which
      hardcodes exitCode=0. doctor must return data (DoctorReport) for --json
      even on failure, so it cannot use plain err(). Recommended approach:
      doctor builds CommandResult<DoctorReport> directly with a non-zero
      exitCode (e.g. EXIT_CONFIG=10 or a dedicated DOCTOR_FAIL code) when any
      check reports fail, while still attaching data=report. This keeps the
      report visible AND gates CI on exit code. The plan-writer should pick a
      concrete exit code (suggest EXIT_CONFIG=10 — "config/environment not
      ready" — or add DOCTOR_FAIL to CODE_TO_EXIT).
    type: info
    date: "2026-07-15"
