  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: src/app/doctor.ts:590
    message: >
      The permission-visibility enrichment guards on
      `restrictionsResult.ok && restrictionsResult.value`, but the real
      `getRestrictions` returns `PageRestrictions = { pageId, restricted: boolean }`
      — an always-truthy object. So the "Restrictions detected on parent page"
      branch is ALWAYS taken against the real adapter, even when the page is open
      (`restricted: false`). The unit mock masks this by returning arrays
      (`[]` falsy / `[{...}]` truthy) instead of the PageRestrictions object.
      Impact is cosmetic (both branches emit `warn` and never gate), but the
      "specifics" enrichment is wrong against reality.
    suggestion: >
      Narrow on the real field: `restrictionsResult.value.restricted`. Fix the
      mockTarget `getRestrictions` override to return `{ pageId, restricted: ... }`
      (the port shape), not arrays.
