    location: src/app/doctor.ts:614-620,97-111
    message: >
      AC-F5-1 requires "Given the renderer dependency surface fails to
      initialize ... the renderer check reports warn with a fix (informational)."
      The implementation hardcodes the renderer check as `pass` in both the main
      path (line 614) and the `advisoryChecks()` helper (line 105), and
      `DoctorDeps` exposes no renderer seam, so the warn path is neither
      implemented nor testable. TC-DOCTOR-008 is mislabeled "Renderer
      initialization fails → renderer warn" but injects no failure and asserts
      `status).toBe("pass")`. The plan's RSK-R1 hedging ("pass with informational
      message for now") is a coder note, not a spec/AC amendment.
    suggestion: >
      Either (a) add a renderer probe + an injectable renderer seam on
      DoctorDeps, implement the warn-on-init-failure path, and correct
      TC-DOCTOR-008/TC-DOCTOR-021 to inject the failure and assert `warn` + a
      `fix`; or (b) formally descope AC-F5-1's warn path via a spec + plan
      revision (amend AC-F5-1 to "informational pass; warn path deferred to
      MS-0003") and rename TC-DOCTOR-008 accordingly. F-5 is warn-only and never
      gates, so either resolution is acceptable — but the current AC-vs-code
      mismatch must be reconciled, not left silent.
