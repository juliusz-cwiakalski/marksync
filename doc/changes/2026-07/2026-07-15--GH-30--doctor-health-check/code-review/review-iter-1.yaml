findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: src/app/doctor.ts:372,411
    message: >
      The space-access and parent-page checks detect a 403-forbidden outcome
      with `error.kind === "Auth"`, but the real Confluence adapter (PageService,
      RestrictionsService, etc.) returns `{ kind: "Forbidden", pageId, operation }`
      for 403s. `kind: "Auth"` is only ever produced by credential resolution
      (resolveCredentials/validateCredentials), never by TargetSystem operations.
      Against the real adapter the forbidden-specific detail/fix branch is dead
      code: a 403 falls through to the generic "Space access failed: Forbidden" /
      "Parent page access failed: Forbidden" message with the generic fix, so
      AC-F2-2's "distinguishing unreachable from forbidden" requirement is not
      honestly met in production. Status is still `fail` and exit is still 60, so
      the CI gate and report still function, but the AI-readable distinction the
      AC requires is lost.
    suggestion: >
      Change both guards to `error.kind === "Forbidden"` (the real domain kind
      for 403). Re-run TC-DOCTOR-004.2/005.2 with the corrected mock shape (see
      F-2) and assert the distinguishing detail ("not accessible (403
      forbidden)" vs "Base URL unreachable") and the distinct fix.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: high
    confidence: high
    category: correctness
    location: tests/unit/app/doctor.test.ts:326,413
    message: >
      TC-DOCTOR-004.2 and TC-DOCTOR-005.2 mock `{ kind: "Auth", authKind: "Forbidden" }`
      to exercise the forbidden path. This variant does NOT exist in MarkSyncError:
      the `Auth` arm's `authKind` is `MissingCredentials | InvalidBaseUrl |
      InvalidCredentials | AuthUnreachable` — there is no `Forbidden` authKind, and
      target 403s are a separate `kind: "Forbidden"`. The impossible variant
      satisfies the buggy `kind === "Auth"` guard (F-1), making the tests pass
      while masking the production defect. This is the same failure class as the
      earlier hallucinated `deletePage` that bun-test (type-stripping) could not
      catch. Additionally, integration TC-DOCTOR-017/018 only assert the
      `space-access`/`parent-page` status is `fail`, not the distinguishing
      detail, so they pass despite F-1.
    suggestion: >
      Replace both mocks with the real shape `{ kind: "Forbidden", pageId: "...",
      operation: "..." }`. After fixing F-1, assert the detail contains "403" /
      "forbidden" (and "unreachable" in the TC-DOCTOR-004.1/005-not-found arms).
      Strengthen integration TC-DOCTOR-017/018 to assert the distinguishing
      detail text, not just the fail status, so the AC-F2-2 contract is gated.
    suppressed: false
