summary: >
  The doctor health-check is structurally sound and the full quality gate is
  green (1247 pass / 0 fail; typecheck, boundaries, lint, format all clean).
  The core value proposition holds: read-only default (verified 0 writes in
  TC-DOCTOR-013), exit 60 on any fail with data always present and error unset
  (DEC-4/TDR-0009 honored), self-cleaning scratch-page probe (TC-DOCTOR-019),
  no token leakage (INV-SEC-1), additive EXIT_HEALTH=60/DOCTOR_FAIL extension,
  and clean DEC-1 tier discipline. HOWEVER, two HIGH-severity defects block an
  honest PASS: (1) the space-access/parent-page forbidden-detection branches
  check `error.kind === "Auth"` but the real Confluence adapter returns
  `kind: "Forbidden"` for 403s — so AC-F2-2's "distinguishing unreachable from
  forbidden" degrades to a generic message against the real target; (2) the
  two unit tests that claim to cover that path mock an impossible
  `{ kind: "Auth", authKind: "Forbidden" }` variant that does not exist in the
  MarkSyncError union, masking the bug (same defect class as the earlier
  hallucinated deletePage). A medium renderer-AC gap (AC-F5-1 warn path
  unimplemented) and a CLI_VERSION release-contract mismatch (0.6.0 vs 0.7.0)
  round out the blocking items. Remediation phase appended to the plan.
