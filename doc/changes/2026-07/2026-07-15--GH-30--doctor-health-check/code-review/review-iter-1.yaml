    category: correctness
    location: src/cli/commands/doctor.ts:38
    message: >
      On the abort path the handler computes
      `exitCode: mapped.code ? codeToExitCode(mapped.code) : EXIT_HEALTH`.
      Falling back to `EXIT_HEALTH` (60) for an unexpected infrastructure error
      conflates the doctor-health-fail signal with a genuine command error;
      `EXIT_INTERNAL` (99) would be semantically correct. The branch is
      essentially dead (mapMarkSyncErrorToCommandError always returns a code),
      so this is cosmetic.
    suggestion: >
      Use `EXIT_INTERNAL` as the fallback (or rely on `codeToExitCode` returning
      EXIT_INTERNAL for unknown codes and drop the ternary).
