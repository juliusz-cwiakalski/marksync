  - text: >
      CRITICAL VERSION-PIN HAZARD identified at intake: spike GH-13 pinned
      Bun 1.1.34 for its one-time validation. CI (ci.yml) + package.json
      pin Bun 1.2.23. The release workflow MUST use 1.2.23 to match CI —
      NOT the spike's 1.1.34. The targets (bun-linux-x64, bun-linux-arm64,
      bun-windows-x64) are stable across these versions (spike TC-BCS-008
      confirmed arm64 targets exist). Spec/plan must encode this.
    type: risk
    date: "2026-07-26"
  - text: >
      DOCKER TAG RECONCILIATION (from spike findings): story scope text says
      "debian:slim" but debian:slim is NOT a published Docker Hub tag. The
      canonical current Debian slim tag is debian:stable-slim (used + verified
      clean-OS by spike H2). Spec/plan MUST use debian:stable-slim.
