notes:
  - text: >
      RETRO — DoR iter-1 NOT_READY (1 BLOCKER + 3 MINOR + 2 NIT). The BLOCKER
      is a genuine, well-caught contradiction: plan simultaneously asserted
      C-NO-SRC (zero src/ changes) + PLN-DEC-3 (bump package.json 0.7.0→0.8.0)
      + DM-3/AC-BUILD-1 (binary --version == package.json#version). But
      src/cli/commands/router.ts:40 hardcodes `export const CLI_VERSION =
      "0.7.0"` with NO runtime package.json read (comment: "Kept in lock-step
      with package.json until a runtime version source is wired"). So bumping
      only package.json → binary still reports 0.7.0 → AC-BUILD-1 FAILs at
      DoD; and the build script's --define process.env.MARKSYNC_VERSION is a
      no-op unless router.ts reads it. PROCESS LESSON: the plan over-constrained
      C-NO-SRC beyond the spec's own G-7/§16 carve-out ("a trivial version-embed
      touch... the only conceivable exception"). The plan-writer dropped that
      carve-out silently. Fix = relax C-NO-SRC to permit the surgical
      version-source wiring in router.ts (import pkg from package.json —
      works in both dev and bun build --compile since Bun inlines JSON imports
      at build time). This permanently fixes the drift the code comment
      itself flags. MINORS: test-plan §1.1 TC count (Ten→Nine), TC-RUN-001
      doctor exit-code assertion (doctor returns EXIT_HEALTH=60 on failing
      check, NOT 0 — align with plan task 2.2 which correctly asserts JSON
      validity), alpine NG citation (§7.3 not NG-8); spec §17.1 DoD should
      note AC-REL-1/AC-COMP-1 are structurally validated at delivery (release.yml
      triggers on v* tag = post-merge), full e2e on first tag. NIT: SBOM action
      pin floating (anchore/sbom-action@v0) — pin concrete version. Reopening
      delivery_planning (BLOCKER + nit), test_planning (minors), specification
      (minor) in parallel — fixes are independent sweeps with no AC/TC ID
      contract changes.
    type: retro
    workItemRef: GH-32
    date: "2026-07-26"
  - text: >
      INTAKE — GH-32 [MS2-E5-S4] Cross-platform binary builds. State
