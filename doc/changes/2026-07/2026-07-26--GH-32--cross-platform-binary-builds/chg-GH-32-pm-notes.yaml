notes:
  - text: >
      RETRO — Quality-gate coverage gap caught pre-PR (2026-07-26): ran the
      python3 yaml.safe_load check (mirrors the ci.yml doc-yaml-lint job) and
      found a STRUCTURAL YAML error in ci.yml — the "Report size/cold-start
      deltas" step (lines 240-311) was over-indented by exactly ONE space
      (`       - name:` = 7 spaces vs correct `      - name:` = 6), breaking
      the `steps:` sequence. bun run check does NOT cover workflow YAML
      (that's a separate CI job), AND review iter-2 claimed "YAMLs parse"
      without actually running the python check — so the gate that WOULD
      catch it (doc-yaml-lint) wasn't exercised locally. Introduced by the
      remediation/nit-fix edits to the delta-report step. PROCESS LESSON:
      review/quality-gate claims about "YAML parses" must be backed by
      actually running the ci.yml doc-yaml-lint equivalent locally
      (python3 yaml.safe_load on .github/workflows/*.yml), not asserted.
      Fixed via mechanical 72-line dedent. This would have BLOCKED the PR
      in CI (doc-yaml-lint is binding). Good that PM ran the actual gate.
    type: retro
    workItemRef: GH-32
    date: "2026-07-26"
  - text: >
      RETRO — Review iter-1 FAIL (1 BLOCKER + 3 MAJOR + 4 MINOR + 5 NIT). The
      BLOCKER is a genuine merge-blocker: the doctor smoke step in ci.yml
      pipes `doctor --json | head -c 100` under the job's default
      `bash --noprofile --norc -eo pipefail`. In the clean-OS context doctor
      returns EXIT_HEALTH=60 (no git → git-available=fail; no marksync.yml →
      config-valid=fail). With pipefail the pipeline returns 60, set -e kills
      the step → binary-smoke job fails on EVERY CI run. PROCESS LESSON: the
      test-plan TC-RUN-001 was CORRECTLY fixed in DoR iter-1 to "assert valid
      JSON, record actual exit code (0 or 60), do NOT hard-assert exit 0" —
      and plan task 2.2 said the same — but the @coder implemented a pipefail
      trap anyway. Classic implementation-vs-spec drift: the spec/plan/test-plan
      all agreed, the code diverged. The review gate caught it (its purpose).
      MAJORs: M-1 size/cold-start delta-report is a stub (plan task 3.2 marked
      done but CHECKED_BUT_MISSING — prints placeholder, no actual comparison
      vs .benchmarks/binaries.json); M-2 "no runtime present" assertion is a
      no-op (swallowed by `; echo`/`|| echo` so AC-RUN1-1 sub-claim not
      enforced); M-3 doc-sync overclaims "validated" for the broken CI job
      (dependent on B-1/M-2 fix). MINORs: README quick-start example broken
      (--target linux-x64 invalid, ./build wrong dir), cold-start measurement
      contaminated by version output (merges --version stdout with timing),
      binary-smoke job no permissions:{}, apt-get not fault-tolerant.
      Delegating ALL blocker+major+minor + actionable nits to @coder for
      Phase 7 remediation, then re-review. NOTE: doc-syncer reported
      bun run check fully GREEN (1309/1309) — the TC-GLOB-012 flake passed
      on that run; the review's AC-CI-1 FAIL is about the binary-smoke CI
      WORKFLOW job, not `bun run check` (which is green).
    type: retro
    workItemRef: GH-32
    date: "2026-07-26"
  - text: >
      RETRO — DoR iter-1 NOT_READY (1 BLOCKER + 3 MINOR + 2 NIT). The BLOCKER
      is a genuine, well-caught contradiction: plan simultaneously asserted
      C-NO-SRC (zero src/ changes) + PLN-DEC-3 (bump package.json 0.7.0→0.8.0)
      + DM-3/AC-BUILD-1 (binary --version == package.json#version). But
      src/cli/commands/router.ts:40 hardcodes `export const CLI_VERSION =
      "0.7.0"` with NO runtime package.json read (comment: "Kept in lock-step
      with package.json until a runtime version source is wired"). So bumping
      only package.json → binary still reports 0.7.0 → AC-BUILD-1 FAILs at
      DoD; and the build script's --define process.env.MARKSYNC_VERSION is a
      no-op unless router.ts reads it. PROCESS LESSON: the plan over-constrained
      C-NO-SRC beyond the spec's own G-7/§16 carve-out ("a trivial version-embed
      touch... the only conceivable exception"). The plan-writer dropped that
      carve-out silently. Fix = relax C-NO-SRC to permit the surgical
      version-source wiring in router.ts (import pkg from package.json —
      works in both dev and bun build --compile since Bun inlines JSON imports
      at build time). This permanently fixes the drift the code comment
      itself flags. MINORS: test-plan §1.1 TC count (Ten→Nine), TC-RUN-001
      doctor exit-code assertion (doctor returns EXIT_HEALTH=60 on failing
      check, NOT 0 — align with plan task 2.2 which correctly asserts JSON
      validity), alpine NG citation (§7.3 not NG-8); spec §17.1 DoD should
      note AC-REL-1/AC-COMP-1 are structurally validated at delivery (release.yml
      triggers on v* tag = post-merge), full e2e on first tag. NIT: SBOM action
      pin floating (anchore/sbom-action@v0) — pin concrete version. Reopening
      delivery_planning (BLOCKER + nit), test_planning (minors), specification
      (minor) in parallel — fixes are independent sweeps with no AC/TC ID
      contract changes.
    type: retro
    workItemRef: GH-32
    date: "2026-07-26"
