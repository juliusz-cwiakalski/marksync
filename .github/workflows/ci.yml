# MarkSync CI — fast loop (lint + typecheck + test on every push/PR)
#
# Runs on: Ubuntu (Bun installed via setup-bun). E2E/lite-sandbox tests are
# gated separately (run-e2e.yml) to keep the fast loop stable.
#
# Implements: TDR-0004 (bun:test primary runner), FSE-audit Attribute 5/6,
# NFR-SEC-4 (dependency audit), TDR-0008 C-2 (CI commit-lint, AC-F4-3).
#
# OPEN-Q9 (closed): every inception-era `continue-on-error: true` and `|| true`
# advisory guard has been removed — lint/typecheck/test/boundary/audit signals
# are now BINDING. Bun is pinned to a concrete patch (NFR-6 / DEC-6).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-loop:
    name: Lint + Typecheck + Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # MS-0002 target: Linux + Windows. macOS deferred to MS-0003.
        # Windows added at MS-0002 implementation start.
        # Pinned to a concrete patch for snapshot stability (NFR-6 / DEC-6);
        # must match package.json#engines.bun.
        bun-version: ["1.2.23"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `commitlint --from origin/main` resolves (AC-F4-3).
          # The default fetch-depth: 1 (shallow) makes origin/main ambiguous.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        # CI authoritative Conventional Commits gate (TDR-0008 C-2 / AC-F4-3).
        # Defense-in-depth with the local husky commit-msg hook: this catches
        # `--no-verify` commits the local hook skips. Runs directly (no 3rd-party
        # Action) so @commitlint/cli from devDeps is the only thing needed.
        run: bunx commitlint --from origin/main --to HEAD

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + integration + golden — exclude E2E and BDD)
        # Exclude E2E (live-sandbox, run-e2e.yml) and BDD (cucumber CLI) from
        # the bun:test fast loop. BDD runs via `bun run test:bdd` below.
        # --coverage: enforce the src/ coverage thresholds (bunfig.toml) on the
        # comprehensive suite. Tier-scoped jobs (e2e-mock) run without coverage.
        run: bun test --coverage tests/unit/ tests/integration/ tests/golden/

      - name: Check import boundaries (dependency-cruiser)
        # Ports-and-adapters tier enforcement (TDR-0006 / AC-F3-1).
        run: bun run check:boundaries

      - name: BDD lifecycle invariants (cucumber)
        # Runs @cucumber/cucumber for INV-SAFE-1/2/3 + INV-SEC-1 (TDR-0007).
        # Now binding: 4 invariant features (6 scenarios) enforced via test:bdd.
        run: bun run test:bdd

  e2e-mock:
    name: E2E Mock Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Pinned to match fast-loop matrix (package.json#engines.bun)
        bun-version: ["1.2.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e-mock tests (secrets-free)
        # Runs the mock server tests without any secrets (NFR-CI-2).
        # Catches HTTP adapter regressions (GH-71, GH-66) on every PR.
        run: bun test tests/e2e-mock/

  binary-smoke:
    name: Binary Build + Clean-OS Smoke
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Pinned to match fast-loop matrix (package.json#engines.bun; DEC-1)
        bun-version: ["1.2.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries (all targets)
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bash scripts/build-binaries.sh --target windows
          else
            bash scripts/build-binaries.sh --target all
          fi
        shell: bash

      - name: Verify Bun version
        run: |
          bun_version=$(bun --version)
          echo "Bun version: $bun_version"
          if [[ "$bun_version" != "1.2.23" ]]; then
            echo "ERROR: Bun version must be 1.2.23 (DEC-1), got $bun_version"
            exit 1
          fi
        shell: bash

      - name: Verify binary types (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "==> Verifying binary types"
          file ./dist/marksync-linux-x64 | grep -qE "ELF 64-bit.*x86-64" || { echo "FAIL: $(file ./dist/marksync-linux-x64)"; exit 1; }
          file ./dist/marksync-linux-arm64 | grep -qE "ELF 64-bit.*(aarch64|ARM)" || echo "arm64: UNAVAILABLE — recorded for MS-0003"
          file ./dist/marksync-win-x64.exe | grep -qE "PE32\+.*(Windows|x86-64)" || { echo "FAIL: $(file ./dist/marksync-win-x64.exe)"; exit 1; }

      - name: Verify binary types (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "==> Verifying binary types"
          file ./dist/marksync-win-x64.exe | grep -q "PE32+ executable for MS Windows"
        shell: bash

      - name: Verify --version matches package.json (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "==> Verifying --version output"
          expected_version=$(bun -e 'console.log(require("./package.json").version)')
          actual_version=$(./dist/marksync-linux-x64 --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "ERROR: Version mismatch: expected $expected_version, got $actual_version"
            exit 1
          fi
          echo "OK: version matches package.json"

      - name: Verify --version matches package.json (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "==> Verifying --version output"
          expected_version=$(bun -e 'console.log(require("./package.json").version)')
          actual_version=$(./dist/marksync-win-x64.exe --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "ERROR: Version mismatch: expected $expected_version, got $actual_version"
            exit 1
          fi
          echo "OK: version matches package.json"
        shell: bash

      - name: Clean-OS Linux smoke (debian:stable-slim, no runtime)
        if: runner.os == 'Linux'
        run: |
          echo "==> Clean-OS Linux smoke: verifying no Bun/Node/Deno in container"
          if docker run --rm debian:stable-slim sh -c 'command -v bun || command -v node || command -v deno'; then
            echo "ERROR: a language runtime is present in the clean-OS image"; exit 1
          fi
          echo "OK: no Bun/Node/Deno on the clean-OS PATH (NFR-COMP-2)"

          echo "==> Running --version on clean OS"
          docker run --rm -v "$PWD":/x -w /x debian:stable-slim /x/dist/marksync-linux-x64 --version

          echo "==> Running doctor --json on clean OS (validating JSON output)"
          set +e
          doctor_out=$(docker run --rm -v "$PWD":/x -w /x debian:stable-slim /x/dist/marksync-linux-x64 doctor --json 2>/dev/null)
          doctor_exit=$?
          echo "doctor exit=$doctor_exit (60=EXIT_HEALTH expected on clean OS with no git/config)"
          printf '%s' "$doctor_out" | python3 -m json.tool >/dev/null && echo "OK: doctor emitted valid JSON" || { echo "ERROR: doctor did not emit valid JSON"; exit 1; }
          set -e

      - name: Measure binary sizes
        if: runner.os == 'Linux'
        run: |
          echo "==> Measuring binary sizes"
          echo "Binary size measurements:"
          for binary in ./dist/marksync-linux-x64 ./dist/marksync-linux-arm64 ./dist/marksync-win-x64.exe; do
            if [[ -f "$binary" ]]; then
              bytes=$(stat -c %s "$binary")
              mb=$(echo "scale=2; $bytes / 1048576" | bc)
              basename=$(basename "$binary")
              echo "  $basename: $bytes bytes ($mb MB)"
              
              # Flag if > 90 MB (DEC-4: desired, not hard)
              if (( $(echo "$mb > 90" | bc -l) )); then
                echo "    WARNING: exceeds 90 MB desired budget (DEC-4)"
              fi
            fi
          done

      - name: Measure cold-start (linux-x64, n=5)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "==> Measuring cold-start (linux-x64, n=5)"
          docker run --rm -v "$PWD":/x -w /x debian:stable-slim sh -c '
            apt-get update -qq && apt-get install -y -qq time > /dev/null 2>&1 || { echo "warn: /usr/bin/time unavailable — cold-start skipped"; exit 0; }
            echo "Cold-start measurements (wall-clock ms):"
            for i in 1 2 3 4 5; do
              /usr/bin/time -f "%e" /x/dist/marksync-linux-x64 --version >/dev/null 2>>timings || true
            done
          '

      - name: Report size/cold-start deltas vs baseline
        if: runner.os == 'Linux'
        run: |
          echo "==> Size/cold-start delta report (non-blocking, DEC-6)"
          echo "Comparing against .benchmarks/binaries.json baseline"
          if [[ -f ".benchmarks/binaries.json" ]]; then
            echo "Baseline loaded from .benchmarks/binaries.json"
            echo ""
            echo "Size deltas:"
            for target in linux-x64 linux-arm64 win-x64; do
              # Determine the binary path
              if [[ "$target" == "win-x64" ]]; then
                binary="./dist/marksync-win-x64.exe"
              else
                binary="./dist/marksync-${target}"
              fi

              # Get current bytes
              if [[ -f "$binary" ]]; then
                current_bytes=$(stat -c %s "$binary")
                current_mb=$(echo "scale=2; $current_bytes / 1048576" | bc)

                # Get baseline from JSON
                baseline_bytes=$(python3 -c "import json; print(json.load(open('.benchmarks/binaries.json'))['measurements'].get('$target', {}).get('bytes', 'null'))" 2>/dev/null || echo "null")
                baseline_mb=$(python3 -c "import json; print(json.load(open('.benchmarks/binaries.json'))['measurements'].get('$target', {}).get('mb', 'null'))" 2>/dev/null || echo "null")

                if [[ "$baseline_bytes" != "null" && "$baseline_mb" != "null" ]]; then
                  delta_bytes=$((current_bytes - baseline_bytes))
                  delta_mb=$(echo "scale=2; $current_mb - $baseline_mb" | bc)

                  echo "  $target: ${current_mb} MB (baseline ${baseline_mb} MB, Δ ${delta_mb} MB)"

                  # Flag if > 90 MB (DEC-4: desired, not hard)
                  if (( $(echo "$current_mb > 90" | bc -l) )); then
                    echo "    WARNING: exceeds 90 MB desired budget (DEC-4)"
                  fi
                else
                  echo "  $target: ${current_mb} MB (no baseline yet — first measurement)"
                fi
              fi
            done
            echo ""
            echo "Cold-start deltas:"
            for target in linux-x64 linux-arm64 win-x64; do
              # Get baseline cold-start from JSON
              baseline_coldstart=$(python3 -c "import json; print(json.load(open('.benchmarks/binaries.json'))['measurements'].get('$target', {}).get('coldStartMs', {}).get('median', 'null'))" 2>/dev/null || echo "null")

              if [[ "$baseline_coldstart" != "null" && "$baseline_coldstart" != "None" ]]; then
                # Read timings file (5 values in seconds, convert to ms)
                if [[ -f "timings" ]]; then
                  timings_ms=$(awk '{printf "%.0f\n", $1 * 1000}' timings | sort -n)
                  count=$(echo "$timings_ms" | wc -l)
                  if [[ $count -ge 5 ]]; then
                    # Calculate median (3rd value for sorted list of 5)
                    current_median=$(echo "$timings_ms" | sed -n '3p')
                    delta_ms=$((current_median - baseline_coldstart))
                    echo "  $target: ${current_median} ms (baseline ${baseline_coldstart} ms, Δ ${delta_ms} ms, n=5)"
                  else
                    echo "  $target: insufficient timings data ($count values, expected 5)"
                  fi
                else
                  echo "  $target: no timings file (cold-start measurement may have failed)"
                fi
              else
                echo "  $target: no baseline cold-start yet"
              fi
            done
            echo ""
            echo "Policy: deltas are informational, never blocking (DEC-6)"
          else
            echo "No baseline found — will be created on first measurement"
          fi

      - name: Clean-OS Windows smoke (windows-latest, no Wine)
        if: runner.os == 'Windows'
        run: |
          echo "==> Clean-OS Windows smoke: running --version"
          ./dist/marksync-win-x64.exe --version
          echo "OK: Windows binary runs on clean Windows runner (closes spike DEC-3)"

  dependency-audit:
    name: License Audit
    runs-on: ubuntu-latest
    # Bun version floats here (NFR-6 narrowed: only the fast-loop matrix is
    # pinned; the audit just needs a working Bun to install for license-checker).
    # Vulnerability scanning moved to the dedicated osv-scan job below (the
    # osv-scanner-action reusable workflow handles checkout/install/scan).
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Check for lockfile
        id: lockfile
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ -f bun.lock ]; then echo "name=bun.lock" >> "$GITHUB_OUTPUT"
            else echo "name=bun.lockb" >> "$GITHUB_OUTPUT"; fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile found — skipping dependency audit (expected during inception)"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        if: steps.lockfile.outputs.exists == 'true'

      - name: License audit
        # Reject GPL/AGPL/LGPL/UNLICENSED third-party dependencies (MarkSync
        # is MIT). BLOCKING. `--excludePrivatePackages` skips the project's own
        # private package.json entry (license-checker misreads the root package
        # as UNLICENSED despite package.json#license being MIT).
        if: steps.lockfile.outputs.exists == 'true'
        run: |
          npx license-checker --production --excludePrivatePackages --failOn "GPL;AGPL;LGPL;UNLICENSED"

  osv-scan:
    # Vulnerability scan via the official osv-scanner reusable workflow
    # (NFR-SEC-4). Replaces the broken `npx @google/osv-scanner` step (the
    # package was never published to npm — the inception-era `|| true` masked
    # the 404). The reusable workflow handles checkout, install, scan, and
    # SARIF upload to the Security tab.
    name: Vulnerability scan (osv-scanner)
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8"

  doc-yaml-lint:
    name: YAML + Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          # Validate all YAML files in the repo parse correctly (doc + workflows)
          python3 -c "
          import yaml, sys, glob
          files = (
            glob.glob('doc/**/*.yaml', recursive=True) +
            glob.glob('doc/**/*.yml', recursive=True) +
            glob.glob('.github/workflows/*.yml') +
            glob.glob('.github/workflows/*.yaml')
          )
          errors = []
          for f in files:
            try:
              yaml.safe_load(open(f))
            except Exception as e:
              errors.append(f'{f} — {e}')
          if errors:
            for e in errors:
              print(f'FAIL: {e}', file=sys.stderr)
            sys.exit(1)
          print(f'OK: {len(files)} YAML files validated')
          "

      - name: Check Markdown links
        run: |
          # Check that every relative .md link in project-authored docs resolves.
          # Excludes ADOS-installed templates/guides (pre-existing broken refs)
          # and doc/inception/tmp/ (vendored repos).
          python3 -c "
          import re, os, sys, glob
          link_re = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
          # Project-authored paths only
          scan_globs = [
            'doc/overview/**/*.md',
            'doc/decisions/**/*.md',
            'doc/spec/**/*.md',
            'doc/inception/open-questions/**/*.md',
            'doc/inception/retrospective/**/*.md',
            'doc/inception/readiness-report.md',
            'doc/inception/README.md',
            'doc/guides/dev-environment.md',
            'doc/guides/security-baseline.md',
            'doc/guides/accessibility-baseline.md',
            'doc/00-index.md',
            'doc/documentation-profile.md',
            'doc/documentation-handbook.md',
            '.ai/**/*.md',
            'AGENTS.md',
            'README.md',
          ]
          errors = []
          for pattern in scan_globs:
            for md_file in glob.glob(pattern, recursive=True):
              if 'doc/inception/tmp/' in md_file:
                continue
              dir_of = os.path.dirname(md_file)
              with open(md_file, encoding='utf-8') as f:
                for line_no, line in enumerate(f, 1):
                  for match in link_re.finditer(line):
                    target = match.group(2).split()[0].split('#')[0]
                    if target.startswith('http') or target.startswith('mailto'):
                      continue
                    if not target.endswith('.md'):
                      continue
                    resolved = os.path.normpath(os.path.join(dir_of, target))
                    if not os.path.exists(resolved):
                      errors.append(f'{md_file}:{line_no} — broken link: {target} (resolved: {resolved})')
          if errors:
            for e in errors[:50]:
              print(f'BROKEN: {e}', file=sys.stderr)
            if len(errors) > 50:
              print(f'... and {len(errors) - 50} more', file=sys.stderr)
            sys.exit(1)
          print('OK: all relative Markdown links resolve')
          "
